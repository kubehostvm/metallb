---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metallb-snat-gateway
  namespace: metallb-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metallb-snat-gateway
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metallb-snat-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metallb-snat-gateway
subjects:
  - kind: ServiceAccount
    name: metallb-snat-gateway
    namespace: metallb-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: metallb-snat-gateway
  namespace: metallb-system
  labels:
    app: metallb-snat-gateway
spec:
  selector:
    matchLabels:
      app: metallb-snat-gateway
  template:
    metadata:
      labels:
        app: metallb-snat-gateway
    spec:
      serviceAccountName: metallb-snat-gateway
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 0
      tolerations:
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 300
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 300
      containers:
        - name: snat-gateway
          image: metallb-snat-gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "/snat-gateway/snat-gateway.sh"]
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - sysctl -w net.ipv4.ip_forward=1
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: EXTERNAL_INTERFACE
              value: "eth0"
            - name: SYNC_INTERVAL
              value: "10"
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
          volumeMounts:
            - mountPath: /snat-gateway
              name: snat-gw-script
              readOnly: true
      volumes:
        - name: snat-gw-script
          configMap:
            name: metallb-snat-gateway-script
            defaultMode: 0755
